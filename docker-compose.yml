services:
  backend:
    build:
      context: ./server
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - MAX_CLIENTS=${MAX_CLIENTS:-50}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./ui
      args:
        WS_URL: ${WS_URL:-ws://localhost:8080}
    ports:
      - "80:80"
    restart: unless-stopped
